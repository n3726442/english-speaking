<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文口說與歌詞跟讀練習器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --secondary: #0d9488;
      --secondary-light: #f0fdfa;
      --danger: #e11d48;
      --danger-light: #fff1f2;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --warning: #f59e0b;
      --bg: #f0f9ff;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #bae6fd;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
    }

    /* 頂部標題與星星統計列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.08);
      border: 1.5px solid var(--border);
      margin-bottom: 16px;
      position: sticky;
      top: 8px;
      z-index: 100;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .star-counter {
      background: #fef3c7;
      color: #b45309;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #fde68a;
    }

    .toggle-btn {
      background: #f8fafc;
      color: var(--text-main);
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .toggle-btn:hover {
      background: #e2e8f0;
    }

    /* 瀏覽器支援度提示 */
    .alert-banner {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* 主題選擇與文章輸入區塊 */
    .input-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.06);
      border: 1.5px solid var(--border);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .input-panel.collapsed {
      display: none;
    }

    .preset-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #cbd5e1;
    }

    .preset-bar label {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--primary);
      white-space: nowrap;
    }

    .preset-select {
      flex: 1;
      min-width: 240px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--primary);
      background-color: #f0f9ff;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .preset-select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
    }

    .custom-area {
      display: none;
    }

    .custom-area.show {
      display: block;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-header span {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      font-size: 1rem;
      resize: vertical;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .hint-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* 主題資訊橫幅 */
    .topic-banner {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: white;
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
    }

    .topic-banner h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .topic-banner p {
      margin: 2px 0 0 0;
      font-size: 0.85rem;
      opacity: 0.92;
    }

    /* 練習卡片列表 */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    .practice-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .practice-card.completed {
      border-color: #86efac;
      background: linear-gradient(to bottom right, #ffffff, #f0fdf4);
    }

    .practice-card.recording {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sentence-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 6px;
    }

    .section-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--secondary);
      background: var(--secondary-light);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-star {
      font-size: 1.4rem;
      filter: grayscale(100%) opacity(0.3);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .practice-card.completed .card-star {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.15);
    }

    /* 英文句子與可點擊單字區 */
    .sentence-display {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.7;
      word-spacing: 2px;
    }

    .zh-translation {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-left: 4px;
    }

    body.hide-zh .zh-translation {
      display: none;
    }

    .clickable-word {
      display: inline-block;
      padding: 1px 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .clickable-word:hover {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .clickable-word:active {
      background-color: #bae6fd;
    }

    /* 按鈕控制列 */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .ctrl-btn {
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      font-family: inherit;
    }

    .ctrl-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .btn-listen {
      color: var(--primary);
      border-color: #bae6fd;
      background: var(--primary-light);
    }

    .btn-listen:hover {
      background: #bae6fd;
    }

    .btn-slow {
      color: var(--secondary);
      border-color: #99f6e4;
      background: var(--secondary-light);
    }

    .btn-slow:hover {
      background: #ccfbf1;
    }

    .btn-mic {
      color: #ffffff;
      background: var(--primary);
      border-color: var(--primary);
      margin-left: auto;
    }

    .btn-mic:hover {
      background: var(--primary-hover);
    }

    .btn-mic.is-recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }

    /* 辨識結果回饋區 */
    .result-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-status {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .diff-words {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .word-ok {
      color: var(--success);
      background: var(--success-light);
      padding: 2px 5px;
      border-radius: 5px;
      margin-right: 4px;
      display: inline-block;
    }

    .word-miss {
      color: var(--danger);
      background: var(--danger-light);
      padding: 2px 5px;
      border-radius: 5px;
      margin-right: 4px;
      text-decoration: underline wavy #fda4af;
      display: inline-block;
    }

    .heard-raw {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 手機版適配 */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .sentence-display {
        font-size: 1.2rem;
      }
      .btn-mic {
        width: 100%;
        justify-content: center;
        margin-left: 0;
        padding: 11px;
        font-size: 1rem;
      }
      .btn-listen, .btn-slow {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>🗣️ 英文口說與歌詞跟讀</h1>
    </div>
    <div class="stats-bar">
      <div class="star-counter" id="totalStars">⭐ 0 / 0</div>
      <button class="toggle-btn" id="toggleZhBtn" onclick="toggleTranslation()">隱藏中文</button>
      <button class="toggle-btn" id="toggleInputBtn" onclick="toggleInputPanel()">切換主題</button>
    </div>
  </header>

  <div class="alert-banner" id="browserAlert">
    ⚠️ 提醒：目前的瀏覽器可能不支援語音辨識（錄音評分功能）。建議使用 <strong>Google Chrome</strong>、<strong>Microsoft Edge</strong> 或 <strong>Safari</strong> 開啟，並允許麥克風權限。
  </div>

  <!-- 主題選單與文章輸入區 -->
  <section class="input-panel" id="inputPanel">
    <div class="preset-bar">
      <label for="topicSelect">📚 選擇練習主題：</label>
      <select id="topicSelect" class="preset-select" onchange="handleTopicChange()">
        <option value="moana_highlight">🌊 《海洋奇緣》How Far I'll Go（第一段＋副歌精選）</option>
        <option value="moana_full">🌊 《海洋奇緣》How Far I'll Go（完整版歌詞）</option>
        <option value="nature_story">☀️ 自然與生活短文（基礎練習）</option>
        <option value="custom">✏️ 自訂文章 / 貼上新歌詞...</option>
      </select>
    </div>

    <div class="hint-text" id="presetHint">
      💡 提示：點擊句子中的「單一英文單字」可以單獨聽發音；按下「錄音測試」唸出整句即可獲得星星！
    </div>

    <!-- 自訂輸入區（選擇「自訂文章」時展開） -->
    <div class="custom-area" id="customArea">
      <div class="input-header">
        <span>請在下方貼上任何英文文章或歌詞（系統會自動斷句）：</span>
      </div>
      <textarea id="sourceText" placeholder="請在此貼上英文文章或歌詞..."></textarea>
      <div class="input-actions">
        <span class="hint-text">支援依換行或標點符號自動切分句子</span>
        <button class="btn-primary" onclick="generateCustomCards()">✨ 生成練習卡片</button>
      </div>
    </div>
  </section>

  <!-- 當前主題說明橫幅 -->
  <div class="topic-banner" id="topicBanner">
    <div>
      <h2 id="bannerTitle">🌊 《海洋奇緣》How Far I'll Go（精選段）</h2>
      <p id="bannerDesc">Disney's Moana • 點擊單字可聽獨立發音，挑戰集滿所有星星！</p>
    </div>
  </div>

  <!-- 下方互動練習卡片區 -->
  <main class="cards-list" id="cardsContainer"></main>
</div>

<script>
  // 預設題庫資料庫（含段落標籤與中文對照翻譯）
  const PRESET_TOPICS = {
    moana_highlight: {
      title: "🌊 《海洋奇緣》How Far I'll Go（精選段）",
      desc: "Disney's Moana • 第一段主歌與經典副歌，適合單堂課分段練習",
      items: [
        { tag: "Verse 1", en: "I've been staring at the edge of the water", zh: "我一直凝望著水岸的盡頭" },

      ]
    },
    moana_full: {
      title: "🌊 《海洋奇緣》How Far I'll Go（完整版歌詞）",
      desc: "Disney's Moana • 全曲完整練習，挑戰成為海洋奇緣口說大師！",
      items: [
        { tag: "Verse 1", en: "I've been staring at the edge of the water", zh: "我一直凝望著水岸的盡頭" },

        { tag: "Chorus", en: "And no one knows, how far it goes", zh: "沒有人知道，它究竟延伸到多遠的地方" },

        { tag: "Verse 2", en: "So maybe I can roll with mine", zh: "所以也許我可以順應並扮演好我的角色" },
        { tag: "Bridge", en: "I can lead with pride, I can make us strong", zh: "我可以驕傲地帶領大家，我可以讓我們變得強大" },
        { tag: "Bridge", en: "I'll be satisfied if I play along", zh: "只要我照著大家的期望走，我也會感到滿足" },
        { tag: "Bridge", en: "But the voice inside sings a different song", zh: "但內心深處的聲音，卻唱著一首截然不同的歌" },
        { tag: "Bridge", en: "What is wrong with me?", zh: "我究竟是怎麼了？" },
        { tag: "Chorus 2", en: "See the light as it shines on the sea? It's blinding", zh: "看見海面上閃耀的光芒了嗎？如此耀眼奪目" },

        { tag: "Chorus 2", en: "And let me know, what's beyond that line, will I cross that line?", zh: "讓我知道，那條地平線的彼端有什麼，我會跨越那條界線嗎？" },
        { tag: "Outro", en: "See the line where the sky meets the sea? It calls me", zh: "看見天空與大海交會的那條線了嗎？它在呼喚著我" },
        { tag: "Outro", en: "And no one knows, how far it goes", zh: "沒有人知道，它究竟延伸到多遠的地方" },
        { tag: "Outro", en: "If the wind in my sail on the sea stays behind me", zh: "如果海上的風吹進我的船帆，在身後推著我前進" },
        { tag: "Outro", en: "One day I'll know, how far I'll go", zh: "總有一天我會明白，我究竟能走多遠" }
      ]
    },
    nature_story: {
      title: "☀️ 自然與生活短文（基礎練習）",
      desc: "適合暖身練習的日常英語短句",
      items: [
        { tag: "Sentence 1", en: "Look at the bright morning sun in the sky.", zh: "看看天空中明亮的朝陽。" },
        { tag: "Sentence 2", en: "Little birds are singing happily in the green trees.", zh: "小鳥在綠樹間快樂地歌唱。" },
        { tag: "Sentence 3", en: "Every day is a brand new adventure to explore.", zh: "每一天都是一場等待探索的全新冒險。" },
        { tag: "Sentence 4", en: "Take a deep breath, smile wide, and try your best!", zh: "深吸一口氣，露出燦爛的微笑，全力以赴吧！" }
      ]
    }
  };

  let sentencesData = [];
  let activeRecognition = null;
  let activeRecordingIndex = -1;
  let preferredVoice = null;

  // 初始化語音合成引擎並挑選自然的美式英語發音
  function initVoices() {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      preferredVoice =
        voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
        voices.find(v => v.lang === 'en-US' && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Jenny'))) ||
        voices.find(v => v.lang.startsWith('en-US')) ||
        voices.find(v => v.lang.startsWith('en'));
    }
  }

  window.speechSynthesis.onvoiceschanged = initVoices;

  // 檢查瀏覽器語音辨識支援度
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('browserAlert').style.display = 'block';
  }

  // 頁面載入時初始化預設主題（《海洋奇緣》精選段）
  window.addEventListener('DOMContentLoaded', () => {
    initVoices();
    handleTopicChange();
  });

  // 切換主題選單
  function handleTopicChange() {
    const selectedKey = document.getElementById('topicSelect').value;
    const customArea = document.getElementById('customArea');
    const presetHint = document.getElementById('presetHint');

    if (selectedKey === 'custom') {
      customArea.classList.add('show');
      presetHint.style.display = 'none';
      document.getElementById('bannerTitle').textContent = "✏️ 自訂文章 / 歌詞練習";
      document.getElementById('bannerDesc').textContent = "在上方輸入任何英文內容，點擊「生成練習卡片」即可開始";
      if (!document.getElementById('sourceText').value.trim()) {
        document.getElementById('cardsContainer').innerHTML =
          '<div style="text-align:center; color:#64748b; padding:30px;">請在上方文字框貼上英文文章或歌詞，然後點擊「生成練習卡片」。</div>';
        sentencesData = [];
        updateStarCounter();
      } else {
        generateCustomCards();
      }
    } else {
      customArea.classList.remove('show');
      presetHint.style.display = 'block';
      const topic = PRESET_TOPICS[selectedKey];
      document.getElementById('bannerTitle').textContent = topic.title;
      document.getElementById('bannerDesc').textContent = topic.desc;
      renderCards(topic.items);
    }
  }

  // 切換輸入區顯示/隱藏
  function toggleInputPanel() {
    const panel = document.getElementById('inputPanel');
    const btn = document.getElementById('toggleInputBtn');
    panel.classList.toggle('collapsed');
    btn.textContent = panel.classList.contains('collapsed') ? '展開選單' : '收合選單';
  }

  // 切換中文翻譯顯示/隱藏
  function toggleTranslation() {
    document.body.classList.toggle('hide-zh');
    const btn = document.getElementById('toggleZhBtn');
    btn.textContent = document.body.classList.contains('hide-zh') ? '顯示中文' : '隱藏中文';
  }

  // 智慧斷句處理（用於自訂文章模式）
  function splitIntoSentences(rawText) {
    const lines = rawText.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const result = [];

    lines.forEach(line => {
      const parts = line.match(/[^.!?]+[.!?]*["']?/g);
      if (parts) {
        parts.forEach(p => {
          const cleaned = p.trim();
          if (/[a-zA-Z]/.test(cleaned)) {
            result.push({ tag: "", en: cleaned, zh: "" });
          }
        });
      }
    });
    return result;
  }

  // 生成自訂文章卡片
  function generateCustomCards() {
    const text = document.getElementById('sourceText').value;
    const items = splitIntoSentences(text);
    renderCards(items);
  }

  // 渲染練習卡片列表
  function renderCards(items) {
    stopCurrentRecording();
    window.speechSynthesis.cancel();

    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    sentencesData = items.map((item, idx) => ({
      id: idx,
      tag: item.tag || '',
      text: item.en,
      zh: item.zh || '',
      completed: false
    }));

    updateStarCounter();

    if (sentencesData.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#64748b; padding:30px;">目前沒有練習句子，請輸入英文內容後生成卡片。</div>';
      return;
    }

    sentencesData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'practice-card';
      card.id = `card-${index}`;

      // 將句子拆分為可點擊的單字 span
      const wordsHtml = item.text.split(/\s+/).map(token => {
        const cleanWord = token.replace(/^[^a-zA-Z0-9']+|[^a-zA-Z0-9']+$/g, '');
        if (!cleanWord) return `<span>${escapeHtml(token)}</span>`;
        return `<span class="clickable-word" title="點擊聽單字發音" onclick="speakText('${escapeJs(cleanWord)}', 0.9)">${escapeHtml(token)}</span>`;
      }).join(' ');

      const tagHtml = item.tag ? `<span class="section-tag">${escapeHtml(item.tag)}</span>` : '';
      const zhHtml = item.zh ? `<div class="zh-translation">${escapeHtml(item.zh)}</div>` : '';

      card.innerHTML = `
        <div class="card-top">
          <div class="badge-group">
            <span class="sentence-badge">第 ${index + 1} 句</span>
            ${tagHtml}
          </div>
          <span class="card-star" id="star-${index}">⭐</span>
        </div>
        <div class="sentence-display">${wordsHtml}</div>
        ${zhHtml}
        <div class="controls-row">
          <button class="ctrl-btn btn-listen" onclick="speakText('${escapeJs(item.text)}', 0.95)">
            🔊 聽發音
          </button>
          <button class="ctrl-btn btn-slow" onclick="speakText('${escapeJs(item.text)}', 0.65)">
            🐢 慢速播放
          </button>
          <button class="ctrl-btn btn-mic" id="mic-btn-${index}" onclick="toggleRecord(${index})">
            🎤 錄音測試
          </button>
        </div>
        <div class="result-box" id="result-${index}">
          <div class="result-status" id="status-${index}"></div>
          <div class="diff-words" id="diff-${index}"></div>
          <div class="heard-raw" id="heard-${index}"></div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  // 文字轉語音朗讀
  function speakText(text, rate = 0.95) {
    if (!('speechSynthesis' in window)) {
      alert('抱歉，您的瀏覽器不支援語音朗讀功能。');
      return;
    }
    stopCurrentRecording();
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = rate;
    if (preferredVoice) {
      utterance.voice = preferredVoice;
    }
    window.speechSynthesis.speak(utterance);
  }

  // 切換錄音狀態
  function toggleRecord(index) {
    if (!SpeechRecognition) {
      alert('您的瀏覽器不支援語音辨識功能，請改用 Chrome、Edge 或 Safari 瀏覽器。');
      return;
    }

    if (activeRecordingIndex === index) {
      stopCurrentRecording();
      return;
    }

    stopCurrentRecording();
    window.speechSynthesis.cancel();
    startRecording(index);
  }

  function startRecording(index) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    activeRecognition = recognition;
    activeRecordingIndex = index;

    const card = document.getElementById(`card-${index}`);
    const micBtn = document.getElementById(`mic-btn-${index}`);
    const resultBox = document.getElementById(`result-${index}`);
    const statusEl = document.getElementById(`status-${index}`);

    card.classList.add('recording');
    micBtn.classList.add('is-recording');
    micBtn.innerHTML = '⏹️ 正在聆聽... (點擊停止)';

    resultBox.classList.add('show');
    statusEl.innerHTML = '<span style="color:#e11d48;">🎙️ 請對著麥克風唸出上方句子...</span>';
    document.getElementById(`diff-${index}`).innerHTML = '';
    document.getElementById(`heard-${index}`).innerHTML = '';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      evaluatePronunciation(index, transcript);
    };

    recognition.onerror = (event) => {
      let msg = '沒有聽清楚聲音，請再試一次！';
      if (event.error === 'not-allowed') {
        msg = '❌ 麥克風權限被拒絕。若在 Google Sites 內嵌中發生此問題，請改用獨立網頁連結開啟。';
      } else if (event.error === 'no-speech') {
        msg = '🤔 沒有偵測到聲音，請靠近麥克風再試一次。';
      }
      statusEl.innerHTML = `<span style="color:#e11d48;">${msg}</span>`;
    };

    recognition.onend = () => {
      resetMicUI(index);
      activeRecognition = null;
      activeRecordingIndex = -1;
    };

    try {
      recognition.start();
    } catch (e) {
      resetMicUI(index);
    }
  }

  function stopCurrentRecording() {
    if (activeRecognition) {
      try {
        activeRecognition.stop();
      } catch (e) {}
    }
    if (activeRecordingIndex !== -1) {
      resetMicUI(activeRecordingIndex);
    }
    activeRecognition = null;
    activeRecordingIndex = -1;
  }

  function resetMicUI(index) {
    const card = document.getElementById(`card-${index}`);
    const micBtn = document.getElementById(`mic-btn-${index}`);
    if (card) card.classList.remove('recording');
    if (micBtn) {
      micBtn.classList.remove('is-recording');
      micBtn.innerHTML = '🎤 錄音測試';
    }
  }

  // 文字標準化（處理縮寫與標點符號，讓口說辨識更寬容準確）
  function normalizeTextForCompare(str) {
    return str
      .toLowerCase()
      .replace(/’/g, "'")
      .replace(/\bi've\b/g, "i have")
      .replace(/\bi'll\b/g, "i will")
      .replace(/\bit's\b/g, "it is")
      .replace(/\bthere's\b/g, "there is")
      .replace(/\bwhat's\b/g, "what is")
      .replace(/\bcannot\b/g, "can not")
      .replace(/[^a-z0-9\s]/g, ' ')
      .trim();
  }

  // 評估發音並產生紅綠字比對結果
  function evaluatePronunciation(index, spokenText) {
    const targetText = sentencesData[index].text;
    const targetTokens = targetText.split(/\s+/);

    // 將 AI 聽到的內容展開標準化後拆成單字池
    const normalizedSpoken = normalizeTextForCompare(spokenText);
    const spokenPool = normalizedSpoken.split(/\s+/).filter(Boolean);

    let matchCount = 0;
    let totalCleanWords = 0;

    const diffHtml = targetTokens.map(token => {
      const normalizedToken = normalizeTextForCompare(token);
      if (!normalizedToken) return `<span>${escapeHtml(token)}</span>`;

      totalCleanWords++;
      const subWords = normalizedToken.split(/\s+/).filter(Boolean);

      // 檢查該 token 展開後的所有子單字是否都在辨識結果中
      let allSubMatched = true;
      const tempPool = [...spokenPool];

      for (const sw of subWords) {
        const idxInPool = tempPool.indexOf(sw);
        if (idxInPool !== -1) {
          tempPool.splice(idxInPool, 1);
        } else {
          allSubMatched = false;
          break;
        }
      }

      if (allSubMatched) {
        matchCount++;
        // 正式從 spokenPool 中扣除已配對的單字
        for (const sw of subWords) {
          const idxInPool = spokenPool.indexOf(sw);
          if (idxInPool !== -1) spokenPool.splice(idxInPool, 1);
        }
        return `<span class="word-ok" title="發音清晰！">${escapeHtml(token)}</span>`;
      } else {
        return `<span class="word-miss" title="可以再聽一次發音練習喔">${escapeHtml(token)}</span>`;
      }
    }).join(' ');

    const accuracy = totalCleanWords > 0 ? Math.round((matchCount / totalCleanWords) * 100) : 0;
    const isPassed = accuracy >= 80;

    const statusEl = document.getElementById(`status-${index}`);
    const diffEl = document.getElementById(`diff-${index}`);
    const heardEl = document.getElementById(`heard-${index}`);
    const card = document.getElementById(`card-${index}`);

    if (isPassed) {
      sentencesData[index].completed = true;
      card.classList.add('completed');
      statusEl.innerHTML = `
        <span style="color:#16a34a;">🎉 太棒了！發音很清楚（準確度 ${accuracy}%）</span>
        <span style="color:#d97706;">獲得星星 ⭐</span>
      `;
    } else {
      statusEl.innerHTML = `
        <span style="color:#d97706;">💪 繼續加油！紅色單字可以點一下聽發音再試一次（準確度 ${accuracy}%）</span>
      `;
    }

    diffEl.innerHTML = diffHtml;
    heardEl.innerHTML = `AI 聽到的內容：「${escapeHtml(spokenText)}」`;

    updateStarCounter();
  }

  // 更新總星星數量
  function updateStarCounter() {
    const total = sentencesData.length;
    const earned = sentencesData.filter(s => s.completed).length;
    document.getElementById('totalStars').textContent = `⭐ ${earned} / ${total}`;
  }

  // 安全性跳脫字元處理
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeJs(str) {
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
  }
</script>
