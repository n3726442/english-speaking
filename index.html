<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文口說跟讀練習器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #0d9488;
      --secondary-light: #f0fdfa;
      --danger: #e11d48;
      --danger-light: #fff1f2;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --warning: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 頂部標題與星星統計列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      position: sticky;
      top: 8px;
      z-index: 100;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .star-counter {
      background: #fef3c7;
      color: #b45309;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #fde68a;
    }

    .toggle-btn {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      background: #e2e8f0;
    }

    /* 瀏覽器支援度提示 */
    .alert-banner {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* 文章輸入區塊 */
    .input-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .input-panel.collapsed {
      display: none;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .input-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .sample-btn {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .sample-btn:hover {
      background: var(--primary-light);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      font-size: 1rem;
      resize: vertical;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .hint-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* 練習卡片列表 */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    .practice-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1.5px solid var(--border);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .practice-card.completed {
      border-color: #86efac;
      background: linear-gradient(to bottom right, #ffffff, #f7fee7);
    }

    .practice-card.recording {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .sentence-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .card-star {
      font-size: 1.4rem;
      filter: grayscale(100%) opacity(0.3);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .practice-card.completed .card-star {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.15);
    }

    /* 英文句子與可點擊單字區 */
    .sentence-display {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.7;
      word-spacing: 2px;
    }

    .clickable-word {
      display: inline-block;
      padding: 1px 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .clickable-word:hover {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .clickable-word:active {
      background-color: #dbeafe;
    }

    /* 按鈕控制列 */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .ctrl-btn {
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      font-family: inherit;
    }

    .ctrl-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .btn-listen {
      color: var(--primary);
      border-color: #bfdbfe;
      background: var(--primary-light);
    }

    .btn-listen:hover {
      background: #dbeafe;
    }

    .btn-slow {
      color: var(--secondary);
      border-color: #99f6e4;
      background: var(--secondary-light);
    }

    .btn-slow:hover {
      background: #ccfbf1;
    }

    .btn-mic {
      color: #ffffff;
      background: var(--primary);
      border-color: var(--primary);
      margin-left: auto;
    }

    .btn-mic:hover {
      background: var(--primary-hover);
    }

    .btn-mic.is-recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }

    /* 辨識結果回饋區 */
    .result-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-status {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .diff-words {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .word-ok {
      color: var(--success);
      background: var(--success-light);
      padding: 2px 5px;
      border-radius: 5px;
      margin-right: 4px;
      display: inline-block;
    }

    .word-miss {
      color: var(--danger);
      background: var(--danger-light);
      padding: 2px 5px;
      border-radius: 5px;
      margin-right: 4px;
      text-decoration: underline wavy #fda4af;
      display: inline-block;
    }

    .heard-raw {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 手機版適配 */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .sentence-display {
        font-size: 1.2rem;
      }
      .btn-mic {
        width: 100%;
        justify-content: center;
        margin-left: 0;
        padding: 11px;
        font-size: 1rem;
      }
      .btn-listen, .btn-slow {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>🗣️ 英文口說跟讀練習</h1>
    </div>
    <div class="stats-bar">
      <div class="star-counter" id="totalStars">⭐ 0 / 0</div>
      <button class="toggle-btn" id="toggleInputBtn" onclick="toggleInputPanel()">隱藏輸入區</button>
    </div>
  </header>

  <div class="alert-banner" id="browserAlert">
    ⚠️ 提醒：目前的瀏覽器可能不支援語音辨識（錄音評分功能）。建議使用 <strong>Google Chrome</strong>、<strong>Microsoft Edge</strong> 或 <strong>Safari</strong> 開啟，並允許麥克風權限。
  </div>

  <!-- 上方文章輸入區 -->
  <section class="input-panel" id="inputPanel">
    <div class="input-header">
      <label for="sourceText">貼上英文文章或歌詞（系統會自動斷句）：</label>
      <button class="sample-btn" onclick="loadSampleText()">載入範例短文</button>
    </div>
    <textarea id="sourceText" placeholder="請在此貼上英文文章或歌詞..."></textarea>
    <div class="input-actions">
      <span class="hint-text">💡 小提示：練習時，點擊句子裡的「單一英文單字」也可以單獨聽發音喔！</span>
      <button class="btn-primary" onclick="generateCards()">✨ 生成練習卡片</button>
    </div>
  </section>

  <!-- 下方互動練習卡片區 -->
  <main class="cards-list" id="cardsContainer"></main>
</div>

<script>
  // 預設範例文章（原創兒童自然與生活短文）
  const DEFAULT_TEXT = `Look at the bright morning sun in the sky.
Little birds are singing happily in the green trees.
Every day is a brand new adventure to explore.
Take a deep breath, smile wide, and try your best!`;

  let sentencesData = [];
  let activeRecognition = null;
  let activeRecordingIndex = -1;
  let preferredVoice = null;

  // 初始化語音合成引擎並挑選自然的美式英語發音
  function initVoices() {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      preferredVoice =
        voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
        voices.find(v => v.lang === 'en-US' && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Jenny'))) ||
        voices.find(v => v.lang.startsWith('en-US')) ||
        voices.find(v => v.lang.startsWith('en'));
    }
  }

  window.speechSynthesis.onvoiceschanged = initVoices;

  // 檢查瀏覽器語音辨識支援度
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('browserAlert').style.display = 'block';
  }

  // 頁面載入時初始化
  window.addEventListener('DOMContentLoaded', () => {
    initVoices();
    document.getElementById('sourceText').value = DEFAULT_TEXT;
    generateCards();
  });

  // 切換輸入區顯示/隱藏
  function toggleInputPanel() {
    const panel = document.getElementById('inputPanel');
    const btn = document.getElementById('toggleInputBtn');
    panel.classList.toggle('collapsed');
    btn.textContent = panel.classList.contains('collapsed') ? '編輯文章' : '隱藏輸入區';
  }

  // 載入範例文字
  function loadSampleText() {
    document.getElementById('sourceText').value = DEFAULT_TEXT;
    generateCards();
  }

  // 智慧斷句處理
  function splitIntoSentences(rawText) {
    // 先依換行符號切分，再依句尾標點符號 (. ! ?) 切分，保留原標點
    const lines = rawText.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const result = [];

    lines.forEach(line => {
      const parts = line.match(/[^.!?]+[.!?]*["']?/g);
      if (parts) {
        parts.forEach(p => {
          const cleaned = p.trim();
          // 確保至少包含一個英文字母才列入練習句
          if (/[a-zA-Z]/.test(cleaned)) {
            result.push(cleaned);
          }
        });
      }
    });
    return result;
  }

  // 生成練習卡片
  function generateCards() {
    stopCurrentRecording();
    window.speechSynthesis.cancel();

    const text = document.getElementById('sourceText').value;
    const sentences = splitIntoSentences(text);
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    sentencesData = sentences.map((sentence, idx) => ({
      id: idx,
      text: sentence,
      completed: false
    }));

    updateStarCounter();

    if (sentencesData.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#64748b; padding:30px;">請在上方輸入英文句子後點擊「生成練習卡片」。</div>';
      return;
    }

    sentencesData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'practice-card';
      card.id = `card-${index}`;

      // 將句子拆分為可點擊的單字 span
      const wordsHtml = item.text.split(/\s+/).map(token => {
        const cleanWord = token.replace(/^[^a-zA-Z0-9']+|[^a-zA-Z0-9']+$/g, '');
        if (!cleanWord) return `<span>${escapeHtml(token)}</span>`;
        return `<span class="clickable-word" title="點擊聽單字發音" onclick="speakText('${escapeJs(cleanWord)}', 0.9)">${escapeHtml(token)}</span>`;
      }).join(' ');

      card.innerHTML = `
        <div class="card-top">
          <span class="sentence-badge">第 ${index + 1} 句</span>
          <span class="card-star" id="star-${index}">⭐</span>
        </div>
        <div class="sentence-display">${wordsHtml}</div>
        <div class="controls-row">
          <button class="ctrl-btn btn-listen" onclick="speakText('${escapeJs(item.text)}', 0.95)">
            🔊 聽發音
          </button>
          <button class="ctrl-btn btn-slow" onclick="speakText('${escapeJs(item.text)}', 0.65)">
            🐢 慢速播放
          </button>
          <button class="ctrl-btn btn-mic" id="mic-btn-${index}" onclick="toggleRecord(${index})">
            🎤 錄音測試
          </button>
        </div>
        <div class="result-box" id="result-${index}">
          <div class="result-status" id="status-${index}"></div>
          <div class="diff-words" id="diff-${index}"></div>
          <div class="heard-raw" id="heard-${index}"></div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  // 文字轉語音朗讀
  function speakText(text, rate = 0.95) {
    if (!('speechSynthesis' in window)) {
      alert('抱歉，您的瀏覽器不支援語音朗讀功能。');
      return;
    }
    stopCurrentRecording();
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = rate;
    if (preferredVoice) {
      utterance.voice = preferredVoice;
    }
    window.speechSynthesis.speak(utterance);
  }

  // 切換錄音狀態
  function toggleRecord(index) {
    if (!SpeechRecognition) {
      alert('您的瀏覽器不支援語音辨識功能，請改用 Chrome、Edge 或 Safari 瀏覽器。');
      return;
    }

    // 如果正在錄同一句，則停止
    if (activeRecordingIndex === index) {
      stopCurrentRecording();
      return;
    }

    // 如果正在錄別句，先停止舊的
    stopCurrentRecording();
    window.speechSynthesis.cancel();

    startRecording(index);
  }

  function startRecording(index) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    activeRecognition = recognition;
    activeRecordingIndex = index;

    const card = document.getElementById(`card-${index}`);
    const micBtn = document.getElementById(`mic-btn-${index}`);
    const resultBox = document.getElementById(`result-${index}`);
    const statusEl = document.getElementById(`status-${index}`);

    card.classList.add('recording');
    micBtn.classList.add('is-recording');
    micBtn.innerHTML = '⏹️ 正在聆聽... (點擊停止)';

    resultBox.classList.add('show');
    statusEl.innerHTML = '<span style="color:#e11d48;">🎙️ 請對著麥克風唸出上方句子...</span>';
    document.getElementById(`diff-${index}`).innerHTML = '';
    document.getElementById(`heard-${index}`).innerHTML = '';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      evaluatePronunciation(index, transcript);
    };

    recognition.onerror = (event) => {
      let msg = '沒有聽清楚聲音，請再試一次！';
      if (event.error === 'not-allowed') {
        msg = '❌ 麥克風權限被拒絕，請在瀏覽器網址列允許麥克風使用。';
      } else if (event.error === 'no-speech') {
        msg = '🤔 沒有偵測到聲音，請靠近麥克風再試一次。';
      }
      statusEl.innerHTML = `<span style="color:#e11d48;">${msg}</span>`;
    };

    recognition.onend = () => {
      resetMicUI(index);
      activeRecognition = null;
      activeRecordingIndex = -1;
    };

    try {
      recognition.start();
    } catch (e) {
      resetMicUI(index);
    }
  }

  function stopCurrentRecording() {
    if (activeRecognition) {
      try {
        activeRecognition.stop();
      } catch (e) {}
    }
    if (activeRecordingIndex !== -1) {
      resetMicUI(activeRecordingIndex);
    }
    activeRecognition = null;
    activeRecordingIndex = -1;
  }

  function resetMicUI(index) {
    const card = document.getElementById(`card-${index}`);
    const micBtn = document.getElementById(`mic-btn-${index}`);
    if (card) card.classList.remove('recording');
    if (micBtn) {
      micBtn.classList.remove('is-recording');
      micBtn.innerHTML = '🎤 錄音測試';
    }
  }

  // 文字標準化（移除標點符號轉小寫，用於比對）
  function normalizeWord(word) {
    return word.toLowerCase().replace(/[^a-z0-9']/g, '');
  }

  // 評估發音並產生紅綠字比對結果
  function evaluatePronunciation(index, spokenText) {
    const targetText = sentencesData[index].text;
    const targetTokens = targetText.split(/\s+/);
    const spokenWords = spokenText.split(/\s+/).map(normalizeWord).filter(Boolean);

    // 複製一份辨識到的單字池，進行順序與出現比對
    const spokenPool = [...spokenWords];
    let matchCount = 0;
    let totalCleanWords = 0;

    const diffHtml = targetTokens.map(token => {
      const cleanTarget = normalizeWord(token);
      if (!cleanTarget) return `<span>${escapeHtml(token)}</span>`;

      totalCleanWords++;
      const foundIdx = spokenPool.indexOf(cleanTarget);

      if (foundIdx !== -1) {
        matchCount++;
        // 移除已配對的單字，避免重複計算
        spokenPool.splice(foundIdx, 1);
        return `<span class="word-ok" title="發音清晰！">${escapeHtml(token)}</span>`;
      } else {
        return `<span class="word-miss" title="可以再聽一次發音練習喔">${escapeHtml(token)}</span>`;
      }
    }).join(' ');

    const accuracy = totalCleanWords > 0 ? Math.round((matchCount / totalCleanWords) * 100) : 0;
    const isPassed = accuracy >= 80;

    const statusEl = document.getElementById(`status-${index}`);
    const diffEl = document.getElementById(`diff-${index}`);
    const heardEl = document.getElementById(`heard-${index}`);
    const card = document.getElementById(`card-${index}`);

    if (isPassed) {
      sentencesData[index].completed = true;
      card.classList.add('completed');
      statusEl.innerHTML = `
        <span style="color:#16a34a;">🎉 太棒了！發音很清楚（準確度 ${accuracy}%）</span>
        <span style="color:#d97706;">獲得星星 ⭐</span>
      `;
    } else {
      statusEl.innerHTML = `
        <span style="color:#d97706;">💪 繼續加油！紅色單字可以點一下聽發音再試一次（準確度 ${accuracy}%）</span>
      `;
    }

    diffEl.innerHTML = diffHtml;
    heardEl.innerHTML = `AI 聽到的內容：「${escapeHtml(spokenText)}」`;

    updateStarCounter();
  }

  // 更新總星星數量
  function updateStarCounter() {
    const total = sentencesData.length;
    const earned = sentencesData.filter(s => s.completed).length;
    document.getElementById('totalStars').textContent = `⭐ ${earned} / ${total}`;
  }

  // 安全性跳脫字元處理
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeJs(str) {
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
  }
</script>
